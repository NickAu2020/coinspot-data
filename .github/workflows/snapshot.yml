name: CoinSpot snapshot
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/snapshot.py
      - run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data
          git commit -m "snapshot $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
